<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Free, open-source interval workout timers.">
  <meta name="theme-color" content="#405D26">
  <title>Interval Apps</title>
  <link rel="icon" type="image/png" href="tabata/favicon.png">
  <style>
    :root {
      --background: #F4EFEB;
      --surface: #E7DFDA;
      --primary: #405D26;
      --ink: #494949;
      --muted: #AEA79C;
    }

    :root[data-theme="dark"] {
      --background: #1C1A18;
      --surface: #2D2926;
      --primary: #6B9A3E;
      --ink: #ECE6E0;
      --muted: #8F877C;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--background);
      color: var(--ink);
      font-family: Ubuntu, "Segoe UI", system-ui, sans-serif;
    }

    main { width: min(100%, 560px); text-align: center; }

    h1 {
      margin: 0 0 8px;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    p.lead { margin: 0 0 32px; }

    .apps { display: grid; gap: 16px; }

    a.app {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 28px;
      border-radius: 999px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      text-align: left;
      transition: transform 0.2s ease-out;
    }

    a.app:hover, a.app:focus-visible { transform: scale(0.97); }
    a.app:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }

    a.app img { width: 64px; height: 64px; border-radius: 50%; }
    a.app strong { display: block; font-size: 1.25rem; }
    a.app span { color: var(--muted); }

    footer { margin-top: 32px; font-size: 0.875rem; }
    footer a { color: var(--primary); font-weight: 700; }

    /* The theme toggle mirrors the apps' button: the same outlined icons,
       showing the theme it switches to. */
    #theme-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    #theme-toggle:hover {
      background: color-mix(in srgb, var(--primary) 10%, transparent);
    }

    #theme-toggle:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

    #theme-toggle .icon { width: 26px; height: 26px; }
    #theme-toggle .icon-light { display: none; }
    :root[data-theme="dark"] #theme-toggle .icon-light { display: block; }
    :root[data-theme="dark"] #theme-toggle .icon-dark { display: none; }

    /* The flood that covers the theme switch. */
    #theme-flood {
      position: fixed;
      inset: 0;
      pointer-events: none;
      clip-path: circle(0 at 50% 50%);
    }
  </style>
  <script>
    // Applies the theme before the first paint: the saved choice if there is
    // one, the device preference otherwise. The apps persist their theme in
    // SharedPreferences, which on the web is this origin's localStorage under
    // the key "theme"; reading it too keeps the page and the apps in sync.
    (() => {
      const root = document.documentElement;
      const meta = document.querySelector('meta[name="theme-color"]');
      const media = matchMedia('(prefers-color-scheme: dark)');
      const primary = { light: '#405D26', dark: '#6B9A3E' };

      const saved = () => {
        try {
          const value = JSON.parse(localStorage.getItem('theme'));
          return value === 'light' || value === 'dark' ? value : null;
        } catch {
          return null;
        }
      };

      const apply = (theme) => {
        root.dataset.theme = theme;
        meta.setAttribute('content', primary[theme]);
      };

      window.intervalTheme = { apply, saved };

      apply(saved() ?? (media.matches ? 'dark' : 'light'));

      // No saved choice: keep following the device, like ThemeMode.system.
      media.addEventListener('change', () => {
        if (saved() == null) apply(media.matches ? 'dark' : 'light');
      });
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Dark theme">
    <svg class="icon icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.5A8.5 8.5 0 1 1 9.7 3.7a7 7 0 0 0 10.8 10.8z"/>
    </svg>
    <svg class="icon icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
    </svg>
  </button>
  <div id="theme-flood" aria-hidden="true"></div>

  <main>
    <h1>Interval Apps</h1>
    <p class="lead">Free, open-source interval timers. No ads, no account, works offline.</p>

    <div class="apps">
      <a class="app" href="tabata/">
        <img src="tabata/icons/Icon-192.png" alt="">
        <div>
          <strong>Tabata Timer</strong>
          <span>20 s work, 10 s rest, 8 rounds</span>
        </div>
      </a>
      <a class="app" href="walking/">
        <img src="walking/icons/Icon-192.png" alt="">
        <div>
          <strong>Japanese Walking</strong>
          <span>3 min fast, 3 min slow, 5 rounds</span>
        </div>
      </a>
    </div>

    <footer>
      <a href="https://github.com/manul-wizard/interval-apps/releases/tag/preview">Android test builds</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/manul-wizard/interval-apps">Source code on GitHub</a>
    </footer>
  </main>

  <script>
    // The theme floods in from the toggle, like in the apps: a disk of the
    // incoming background grows over the page (350 ms), the theme swaps
    // underneath at full cover, and the disk dissolves away (250 ms).
    (() => {
      const { apply } = window.intervalTheme;
      const root = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const flood = document.getElementById('theme-flood');
      const backgrounds = { light: '#F4EFEB', dark: '#1C1A18' };
      const labels = { light: 'Light theme', dark: 'Dark theme' };
      let switching = false;

      const sync = () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        toggle.setAttribute('aria-label', labels[next]);
      };

      const persist = (theme) => {
        try {
          localStorage.setItem('theme', JSON.stringify(theme));
        } catch {
          // Private browsing: the theme just won't be remembered.
        }
        apply(theme);
        sync();
      };

      toggle.addEventListener('click', () => {
        if (switching) return;
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        const rect = toggle.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const radius = Math.hypot(
          Math.max(x, innerWidth - x),
          Math.max(y, innerHeight - y),
        );

        switching = true;
        flood.style.background = backgrounds[next];
        flood.style.transition = 'clip-path 350ms linear';
        flood.style.clipPath = `circle(0px at ${x}px ${y}px)`;
        void flood.offsetWidth; // start the growth from the closed disk
        flood.style.clipPath = `circle(${radius}px at ${x}px ${y}px)`;

        flood.addEventListener('transitionend', function grown(event) {
          if (event.propertyName !== 'clip-path') return;
          flood.removeEventListener('transitionend', grown);
          persist(next);
          flood.style.transition = 'opacity 250ms linear';
          flood.style.opacity = '0';

          flood.addEventListener('transitionend', function dissolved(event) {
            if (event.propertyName !== 'opacity') return;
            flood.removeEventListener('transitionend', dissolved);
            flood.removeAttribute('style');
            switching = false;
          });
        });
      });

      sync();
    })();
  </script>
</body>
</html>

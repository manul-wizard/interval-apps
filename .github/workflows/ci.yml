name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Problems show up as annotations on the offending lines.
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}
          {{end}}'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated localizations are up to date
        run: |
          for dir in packages/interval_kit apps/tabata apps/walking; do
            (cd "$dir" && flutter gen-l10n)
          done
          git diff --exit-code

      # The lint set in analysis_options.yaml is enforced fully:
      # analyzer infos fail the build too.
      - run: flutter analyze --fatal-infos

      - name: Test
        run: |
          (cd packages/interval_core && dart run coverage:test_with_coverage)
          for dir in packages/interval_kit packages/interval_media apps/tabata apps/walking; do
            (cd "$dir" && flutter test --coverage)
          done

      - name: Check and summarize coverage
        env:
          # Line coverage of every package must stay above this floor.
          COVERAGE_FLOOR: 70
        run: |
          {
            echo "### Test coverage"
            echo
            echo "| Package | Lines |"
            echo "|---|---|"
            for report in */*/coverage/lcov.info; do
              awk -F: -v name="${report%/coverage/lcov.info}" -v floor="$COVERAGE_FLOOR" '
                /^LF:/ { found += $2 }
                /^LH:/ { hit += $2 }
                END {
                  pct = 100 * hit / found
                  printf "| `%s` | %d%% (%d of %d) |\n", name, pct, hit, found
                  if (pct < floor) {
                    printf "::error::%s line coverage %.1f%% is below the %d%% floor\n", name, pct, floor > "/dev/stderr"
                    exit 1
                  }
                }
              ' "$report" || exit 1
            done
          } >> "$GITHUB_STEP_SUMMARY"

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|style|build|ci|chore)(\([a-z]+\))?: .+'
          bad=0
          while IFS= read -r subject; do
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error title=Bad commit subject::$subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..HEAD")
          if [[ $bad -ne 0 ]]; then
            echo 'Commit subjects must look like "feat(kit): scale the countdown ring".'
            echo 'See CONTRIBUTING.md for the full convention.'
            exit 1
          fi

  build:
    name: Build ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tabata, walking]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Phones only: x86_64 would add a third to the size, for emulators.
      - name: Build preview APK
        run: |
          flutter build apk --release -P preview=true \
            --target-platform android-arm,android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk ${{ matrix.app }}-preview.apk
      - name: Build web
        run: flutter build web --release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/${{ matrix.app }}-preview.apk
          retention-days: 14

  preview:
    name: Publish preview builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-apk'
          merge-multiple: true

      # One release, replaced on every push, so the download links never change.
      - name: Replace the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          Test builds of \`main\` at $GITHUB_SHA, for trying the apps before a store release.

          They install as separate apps — *Tabata Preview* and *Walking Preview* — next to the store versions, and each new preview updates the previous one. They are signed with a public test key: never upload them to a store.
          NOTES
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview ./*-preview.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Preview builds" \
            --notes-file notes.md
